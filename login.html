<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Receptionist - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b55);
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 28px;
            color: #dbeafe;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #22c7f2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            color: #ffd166;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>AI Receptionist</h1>

        <div class="subtitle">
            Administrator Login
        </div>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter your username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                required
            >

            <button
                id="loginButton"
                type="submit"
            >
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        "use strict";

        const loginForm =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;

                if (!username || !password) {
                    message.textContent =
                        "Please enter username and password.";

                    return;
                }

                loginButton.disabled = true;
                loginButton.textContent = "Signing in...";
                message.textContent = "";

                try {

                    const response =
                        await fetch("/api/login", {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "same-origin",

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        });

                    const data =
                        await response.json();

                    if (!response.ok || !data.success) {

                        throw new Error(
                            data.message ||
                            data.error ||
                            "Invalid username or password."
                        );
                    }

                    message.style.color = "#8affc1";
                    message.textContent =
                        "Login successful. Opening dashboard...";

                    window.location.href = "/admin";

                } catch (error) {

                    message.style.color = "#ffd166";
                    message.textContent =
                        error.message ||
                        "Login failed. Please try again.";

                    loginButton.disabled = false;
                    loginButton.textContent = "Login";
                }
            }
        );
    </script>

</body>

</html>
